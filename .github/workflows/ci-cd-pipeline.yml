name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test ms-order
        run: ./mvnw test
        working-directory: ms-order

      - name: Build and test ms-payment
        run: ./mvnw test
        working-directory: ms-payment

      - name: Build and test ms-logger
        run: ./mvnw test
        working-directory: ms-logger

      - name: Build and test ms-invoice
        run: ./mvnw test
        working-directory: ms-invoice

      - name: Vet and build ms-paymentagr
        run: |
          go vet ./...
          go build -o /tmp/paymentagr ./...
        working-directory: ms-paymentagr

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Prepare environment
        run: cp project/.env.example project/.env

      - name: Build and run services with Docker Compose
        run: docker compose -f ./project/docker-compose.yml up -d --build

      - name: Wait for services to be ready
        run: sleep 45

      - name: Run health checks
        run: |
          echo "Checking ms-logger service..."
          curl -fsS http://127.0.0.1:1337/ms/api/v1/health/check || exit 1
          echo "Checking ms-paymentagr service..."
          curl -fsS http://127.0.0.1:8081/health || exit 1
          echo "Checking frontend..."
          curl -fsS http://127.0.0.1:3000/login || exit 1

      - name: Stop Docker Compose services
        if: always()
        run: docker compose -f ./project/docker-compose.yml down
