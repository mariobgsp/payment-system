name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.21.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Build and run services with Docker Compose
        run: docker-compose -f ./project/docker-compose.yml up -d --build

      - name: Wait for services to be ready
        run: sleep 90

      - name: Run tests
        run: |
          echo "Checking ms-logger service (with retry)..."
          for i in $(seq 1 20); do
            if curl -f -s http://127.0.0.1:1337/ms/api/v1/health/check; then
              echo "\nms-logger health check OK (attempt $i)"
              exit 0
            fi
            echo "  attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "ms-logger health check did not pass after 20 attempts"
          exit 1

      - name: Capture service logs on failure
        if: always()
        run: |
          echo "===== ms-logger logs ====="
          docker-compose -f ./project/docker-compose.yml logs ms-logger || true
          echo "===== ms-logger inspect (status/exit/error) ====="
          docker inspect -f '{{.State.Status}} {{.State.ExitCode}} {{.State.Error}}' ms-logger || true
          echo "===== kafka logs (tail) ====="
          docker-compose -f ./project/docker-compose.yml logs --tail=30 kafka || true
          echo "===== mongo logs (tail) ====="
          docker-compose -f ./project/docker-compose.yml logs --tail=20 mongo || true
