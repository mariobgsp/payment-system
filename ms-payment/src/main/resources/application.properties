server.port=9090

# transaction db
spring.datasource-transaction.jdbcUrl=jdbc:postgresql://postgres:5432/transaction
#spring.datasource-transaction.jdbcUrl=jdbc:postgresql://localhost:5432/transaction
spring.datasource-transaction.username=${DB_USER:microservices}
spring.datasource-transaction.password=${DB_PASSWORD:password}
spring.datasource-transaction.driverClassName=org.postgresql.Driver

# security (override via environment)
app.security.partner-api-key=${PARTNER_API_KEY:change-me-api-key}
app.security.notify-secret=${NOTIFY_SECRET:change-me-notify-secret}
app.payment.charge-url=${PAYMENT_CHARGE_URL:http://ms-paymentagr:8081/payments/charge}
app.payment.refund-url=${PAYMENT_REFUND_URL:http://ms-paymentagr:8081/payments/refund}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# kafka
#spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVER}
spring.kafka.bootstrap-servers=kafka:9092
# spring.kafka.bootstrap-servers=localhost:29092

# producer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
