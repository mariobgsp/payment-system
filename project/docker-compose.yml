# Phase 6: Go-only minimal stack — postgres + redis + ms-paymentagr + monolith + frontend.
# Java services (ms-order, ms-payment, ms-invoice, ms-logger) and Kafka/Mongo/ZK/kafka-ui
# are decommissioned: invoice → monolith/invoice, logs → PG outbox + GET /v1/logs.
services:
  postgres:
    container_name: postgres
    image: "postgres:15-alpine3.17"
    ports:
      - "127.0.0.1:5432:5432"
    restart: always
    environment:
      - POSTGRES_MULTIPLE_DATABASES=transaction,partner
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data/
      - ./pg-init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  ms-paymentagr:
    container_name: ms-paymentagr
    build:
      context: ./../ms-paymentagr
      dockerfile: ./ms-paymentagr.dockerfile
    restart: always
    environment:
      - REDIS_HOST=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PARTNER_API_KEY=${PARTNER_API_KEY}
      - NOTIFY_SECRET=${NOTIFY_SECRET}
      - NOTIFY_URL=http://monolith:8085/ms/api/v1/payment/notify
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"

  monolith:
    container_name: monolith
    build:
      context: ./../monolith
      dockerfile: ./monolith.dockerfile
    restart: always
    environment:
      - PORT=8085
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/transaction?sslmode=disable
      - REDIS_HOST=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - PARTNER_API_KEY=${PARTNER_API_KEY}
      - NOTIFY_SECRET=${NOTIFY_SECRET}
      - PARTNER_CHARGE_URL=http://ms-paymentagr:8081/payments/charge
      - MONOLITH_PUBLIC_URL=http://monolith:8085
      - FRONTEND_URL=${FRONTEND_URL}
      - INVOICE_DIR=/tmp/invoices
      - LOG_RETENTION_DAYS=30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    container_name: frontend
    build:
      context: ./../frontend
      dockerfile: ./frontend.dockerfile
    restart: always
    environment:
      - MS_ORDER_URL=http://monolith:8085
      - MS_PAYMENT_URL=http://monolith:8085
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      monolith:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pg-data:
